<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мой новый сайт</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #222;
            background: #fff;
        }

        /* Шапка сайта */
        .header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            padding: 0 20px;
            background: #FF7243;
        }

        /* Логотип слева */
        .logo {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
        }

        /* Стили для картинки в логотипе */
        .logo img {
            display: block;
            height: 64px; /* Высота логотипа */
            width: auto;
            border-radius: 50%; /* Если хотите сделать логотип круглым, оставьте эту строку. Если нет - удалите её */
            object-fit: cover; /* Чтобы фото не сплющивалось */
        }

        /* Кнопка по центру */
        .tg-button {
            padding: 12px 28px;
            background: #FFD300;
            color: #222;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 10px;
            transition: filter 0.15s;
        }

        .tg-button:hover {
            filter: brightness(0.95);
        }

        .tg-button:focus-visible,
        .logo:focus-visible {
            outline: 3px solid #222;
            outline-offset: 3px;
        }

        /* Основное содержимое */
        .content {
            flex: 1;
            padding: 40px 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            text-align: center; 
        }

        /* Стили для фото в контенте */
        .content img {
            max-width: 100%;
            height: auto;
            border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            margin-top: 20px;
        }

        /* Подвал */
        .footer {
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #555;
            background: #f3f3f3;
        }

        @media (max-width: 480px) {
            .logo img { height: 48px; }
            .tg-button { padding: 10px 18px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <a class="logo" href="/" aria-label="На главную">
            <!-- ЗДЕСЬ МЫ УКАЗАЛИ ВАШЕ ФОТО ДЛЯ ЛОГОТИПА -->
            <img src="jiusuk_logo.png" alt="Логотип сайта">
        </a>
        <a class="tg-button" href="https://t.me/jiusuk" target="_blank" rel="noopener">Мой tg</a>
    </header>

    <div class="content">
        <h1>Добро пожаловать!</h1>
        <p>А вот и мое первое фото на сайте:</p>
        
        <!-- ЗДЕСЬ ТО ЖЕ САМОЕ ФОТО ВЫВОДИТСЯ НА СТРАНИЦЕ -->
        <img src="jiusuk_logo.png" alt="Мое первое фото">
    </div>

    <footer class="footer">
        Все права защищены партией жмусиков ©
    </footer>

</body>
</html>
