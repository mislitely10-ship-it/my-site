<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мой новый сайт</title>
    <link rel="icon" type="image/jpeg" href="gavgav.jpg">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            display: flex; flex-direction: column; min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #222; background: #fff;
        }
        /* Шапка */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            height: 80px; padding: 0 20px; background: #FF7243;
        }
        .logo img { display: block; height: 64px; width: auto; border-radius: 50%; object-fit: cover; }
        .nav-buttons { display: flex; gap: 10px; }
        .tg-button, .login-btn {
            padding: 10px 20px; background: #FFD300; color: #222; font-size: 16px;
            font-weight: 700; text-decoration: none; border-radius: 10px; border: none; cursor: pointer;
        }
        .tg-button:hover, .login-btn:hover { filter: brightness(0.95); }
        
        /* Основной контент */
        .content { flex: 1; padding: 40px 20px; max-width: 800px; width: 100%; margin: 0 auto; text-align: center; }
        .footer { padding: 20px; text-align: center; font-size: 14px; color: #555; background: #f3f3f3; }
        
        /* Формы */
        .form-box { max-width: 400px; margin: 0 auto; text-align: left; background: #f9f9f9; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px;
        }
        .btn { width: 100%; padding: 12px; background: #FFD300; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn.red { background: #e53935; color: white; margin-top: 15px; }
        .err { color: #e53935; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .success { color: #2e7d32; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .check { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 14px; }
        
        /* Список профилей */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { display: flex; flex-direction: column; align-items: center; padding: 15px; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; background: #FF7243; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-bottom: 10px; }

        /* Личный кабинет */
        .pass-row { display: flex; gap: 5px; align-items: center; }
        .pass-row input { flex: 1; }
        .eye-btn { padding: 10px; background: #eee; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; }
        
        /* Админка */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .admin-table input { margin-bottom: 0; padding: 6px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header class="header">
        <a class="logo" href="#"><img src="jiusuk_logo.png" alt="Логотип"></a>
        <div class="nav-buttons">
            <a class="tg-button" href="https://t.me/jiusuk" target="_blank">Мой tg</a>
            <button class="login-btn" id="btn-nav-login">Войти</button>
        </div>
    </header>

    <main class="content">
        <!-- ГЛАВНАЯ СТРАНИЦА -->
        <div id="page-home">
            <h1>Добро пожаловать!</h1>
            <p>Профили на сайте:</p>
            <div class="grid" id="profiles-list"></div>
        </div>

        <!-- СТРАНИЦА ВХОДА -->
        <div id="page-login" class="hidden">
            <h1>Вход</h1>
            <p style="color: #666;">Узнайте свой логин и пароль у администратора</p>
            <div class="form-box">
                <div class="err" id="login-err"></div>
                <input type="text" id="login-user" placeholder="Логин">
                <input type="password" id="login-pass" placeholder="Пароль">
                <label class="check"><input type="checkbox" id="login-remember"> Запомнить устройство</label>
                <button class="btn" id="btn-do-login">Войти</button>
            </div>
        </div>

        <!-- ЛИЧНЫЙ КАБИНЕТ -->
        <div id="page-account" class="hidden">
            <h1>Личный кабинет</h1>
            <div class="form-box">
                <div style="text-align: center; margin-bottom: 15px;">
                    <div id="acc-avatar-preview"></div>
                    <input type="file" id="acc-avatar-upload" accept="image/*" style="margin-top: 10px; font-size: 12px;">
                </div>
                <label>Отображаемый ник</label>
                <input type="text" id="acc-nick">
                <button class="btn" id="btn-save-nick" style="margin-bottom: 15px;">Сохранить ник</button>

                <label>Логин</label>
                <div class="pass-row" style="margin-bottom: 15px;">
                    <input type="text" id="acc-login" disabled>
                    <button class="eye-btn" data-target="acc-login">👁</button>
                </div>

                <label>Пароль</label>
                <div class="pass-row">
                    <input type="password" id="acc-pass" disabled>
                    <button class="eye-btn" data-target="acc-pass">👁</button>
                </div>

                <button class="btn red" id="btn-logout">Выйти из профиля</button>
            </div>
        </div>

        <!-- АДМИНКА -->
        <div id="page-admin" class="hidden">
            <!-- Форма входа в админку -->
            <div id="admin-login-box" class="form-box">
                <h2>Вход для администратора</h2>
                <div class="err" id="admin-err"></div>
                <input type="text" id="admin-user" placeholder="Логин">
                <input type="password" id="admin-pass" placeholder="Пароль">
                <button class="btn" id="btn-do-admin-login">Войти</button>
            </div>

            <!-- Панель админа -->
            <div id="admin-panel" class="hidden">
                <h2>Управление пользователями</h2>
                <button class="btn red" id="btn-admin-logout" style="width: auto; padding: 8px 15px; margin-bottom: 20px;">Выйти из админки</button>
                
                <div class="form-box" style="margin-bottom: 20px;">
                    <h3>Создать нового пользователя</h3>
                    <div class="err" id="add-err"></div>
                    <input type="text" id="add-login" placeholder="Логин">
                    <input type="text" id="add-pass" placeholder="Пароль">
                    <input type="text" id="add-nick" placeholder="Отображаемый ник (необязательно)">
                    <button class="btn" id="btn-add-user">Создать</button>
                </div>

                <div style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Ник</th><th>Логин</th><th>Пароль</th><th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="admin-users-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">Все права защищены партией жмусиков ©</footer>

    <script>
        // --- БАЗА ДАННЫХ (в памяти браузера) ---
        const getUsers = () => JSON.parse(localStorage.getItem('site_users') || '[]');
        const saveUsers = (users) => localStorage.setItem('site_users', JSON.stringify(users));
        const getSession = () => JSON.parse(sessionStorage.getItem('site_session') || localStorage.getItem('site_session') || 'null');
        const saveSession = (data, remember) => {
            if (remember) localStorage.setItem('site_session', JSON.stringify(data));
            else sessionStorage.setItem('site_session', JSON.stringify(data));
        };
        const clearSession = () => {
            localStorage.removeItem('site_session');
            sessionStorage.removeItem('site_session');
        };

        // --- АДМИНЫ ---
        const ADMINS = [
            { l: "rin", p: "NyU1e0GAFh_t37gwGJtQ" },
            { l: "jus", p: "m9UqB_UVYWpOaTBS7Mc1" }
        ];

        // --- ИНИЦИАЛИЗАЦИЯ И РОУТИНГ ---
        function router() {
            const hash = window.location.hash || '#';
            const session = getSession();

            // Скрываем все страницы
            document.querySelectorAll('.content > div').forEach(el => el.classList.add('hidden'));

            // Навигация в шапке
            const navBtn = document.getElementById('btn-nav-login');
            if (session && session.type === 'user') {
                navBtn.textContent = 'Личный кабинет';
                navBtn.onclick = () => location.hash = '#account';
            } else {
                navBtn.textContent = 'Войти';
                navBtn.onclick = () => location.hash = '#login';
            }

            // Логика страниц
            if (hash === '#admin') {
                document.getElementById('page-admin').classList.remove('hidden');
                if (session && session.type === 'admin') {
                    document.getElementById('admin-login-box').classList.add('hidden');
                    document.getElementById('admin-panel').classList.remove('hidden');
                    renderAdminUsers();
                } else {
                    document.getElementById('admin-login-box').classList.remove('hidden');
                    document.getElementById('admin-panel').classList.add('hidden');
                }
            } 
            else if (hash === '#login') {
                if (session && session.type === 'user') return location.hash = '#account';
                document.getElementById('page-login').classList.remove('hidden');
            } 
            else if (hash === '#account') {
                if (!session || session.type !== 'user') return location.hash = '#login';
                document.getElementById('page-account').classList.remove('hidden');
                renderAccount(session.userId);
            } 
            else {
                document.getElementById('page-home').classList.remove('hidden');
                renderHome();
            }
        }
        window.addEventListener('hashchange', router);

        // --- ГЛАВНАЯ СТРАНИЦА ---
        function renderHome() {
            const users = getUsers().sort((a, b) => a.nick.localeCompare(b.nick));
            const list = document.getElementById('profiles-list');
            if (users.length === 0) {
                list.innerHTML = '<p style="color:#666; grid-column: 1/-1;">Пока никого нет</p>';
                return;
            }
            list.innerHTML = users.map(u => `
                <div class="card">
                    ${u.avatar ? `<img src="${u.avatar}" class="avatar">` : `<div class="avatar">${u.nick.charAt(0).toUpperCase()}</div>`}
                    <b>${u.nick}</b>
                </div>
            `).join('');
        }

        // --- ВХОД ПОЛЬЗОВАТЕЛЯ ---
        document.getElementById('btn-do-login').onclick = () => {
            const l = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value;
            const r = document.getElementById('login-remember').checked;
            const errBox = document.getElementById('login-err');
            errBox.textContent = '';

            const user = getUsers().find(u => u.login.toLowerCase() === l.toLowerCase());
            if (!user) {
                errBox.textContent = 'Неверный логин';
                return;
            }
            if (user.pass !== p) {
                errBox.textContent = 'Неверный пароль';
                return;
            }
            saveSession({ type: 'user', userId: user.id }, r);
            location.hash = '#account';
        };

        // --- ЛИЧНЫЙ КАБИНЕТ ---
        function renderAccount(userId) {
            const user = getUsers().find(u => u.id === userId);
            if (!user) return;

            const avBox = document.getElementById('acc-avatar-preview');
            avBox.innerHTML = user.avatar ? `<img src="${user.avatar}" style="width:100px; height:100px; border-radius:50%; object-fit:cover;">` : `<div class="avatar" style="width:100px; height:100px; font-size:40px;">${user.nick.charAt(0).toUpperCase()}</div>`;

            document.getElementById('acc-nick').value = user.nick;
            document.getElementById('acc-login').value = user.login;
            document.getElementById('acc-pass').value = user.pass;

            // Сохранение ника
            document.getElementById('btn-save-nick').onclick = () => {
                const newNick = document.getElementById('acc-nick').value.trim();
                if (!newNick) return alert('Ник не может быть пустым');
                const users = getUsers();
                const idx = users.findIndex(u => u.id === userId);
                users[idx].nick = newNick;
                saveUsers(users);
                renderAccount(userId);
            };

            // Загрузка аватарки
            document.getElementById('acc-avatar-upload').onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    // Сжимаем картинку через Canvas, чтобы не переполнить память
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = canvas.height = 150;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 150, 150);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        
                        const users = getUsers();
                        const idx = users.findIndex(u => u.id === userId);
                        users[idx].avatar = dataUrl;
                        saveUsers(users);
                        renderAccount(userId);
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };

            // Выход
            document.getElementById('btn-logout').onclick = () => {
                clearSession();
                location.hash = '#';
            };
        }

        // Глазики для паролей
        document.querySelectorAll('.eye-btn').forEach(btn => {
            btn.onclick = () => {
                const input = document.getElementById(btn.dataset.target);
                input.type = input.type === 'password' ? 'text' : 'password';
            };
        });

        // --- АДМИНКА ---
        document.getElementById('btn-do-admin-login').onclick = () => {
            const l = document.getElementById('admin-user').value.trim().toLowerCase();
            const p = document.getElementById('admin-pass').value;
            const errBox = document.getElementById('admin-err');
            errBox.textContent = '';

            const admin = ADMINS.find(a => a.l === l && a.p === p);
            if (admin) {
                saveSession({ type: 'admin' }, false); // Сессия админа до закрытия вкладки
                router();
            } else {
                errBox.textContent = 'Неверный логин или пароль';
            }
        };

        function renderAdminUsers() {
            const users = getUsers();
            const tbody = document.getElementById('admin-users-list');
            tbody.innerHTML = users.map(u => `
                <tr data-id="${u.id}">
                    <td><input type="text" class="edit-nick" value="${u.nick}"></td>
                    <td><input type="text" class="edit-login" value="${u.login}"></td>
                    <td><input type="text" class="edit-pass" value="${u.pass}"></td>
                    <td>
                        <button class="btn" style="width:auto; padding:5px 10px; font-size:12px;" onclick="saveAdminEdit('${u.id}')">Сохранить</button>
                        <button class="btn red" style="width:auto; padding:5px 10px; font-size:12px;" onclick="deleteAdminUser('${u.id}')">Удалить</button>
                    </td>
                </tr>
            `).join('');
        }

        // Создание пользователя
        document.getElementById('btn-add-user').onclick = () => {
            const l = document.getElementById('add-login').value.trim();
            const p = document.getElementById('add-pass').value;
            const n = document.getElementById('add-nick').value.trim() || l;
            const errBox = document.getElementById('add-err');
            errBox.textContent = '';

            if (l.length < 3) return errBox.textContent = 'Логин от 3 символов';
            if (p.length < 4) return errBox.textContent = 'Пароль от 4 символов';
            if (getUsers().some(u => u.login.toLowerCase() === l.toLowerCase())) return errBox.textContent = 'Логин уже существует';

            const users = getUsers();
            users.push({ id: Date.now().toString(), login: l, pass: p, nick: n, avatar: null });
            saveUsers(users);
            
            document.getElementById('add-login').value = '';
            document.getElementById('add-pass').value = '';
            document.getElementById('add-nick').value = '';
            renderAdminUsers();
        };

        // Сохранение изменений в таблице
        window.saveAdminEdit = (id) => {
            const tr = document.querySelector(`tr[data-id="${id}"]`);
            const nick = tr.querySelector('.edit-nick').value.trim();
            const login = tr.querySelector('.edit-login').value.trim();
            const pass = tr.querySelector('.edit-pass').value;

            if(!nick || !login || !pass) return alert('Заполните все поля');

            const users = getUsers();
            const idx = users.findIndex(u => u.id === id);
            users[idx] = { ...users[idx], nick, login, pass };
            saveUsers(users);
            alert('Сохранено!');
        };

        // Удаление
        window.deleteAdminUser = (id) => {
            if(!confirm('Удалить пользователя?')) return;
            const users = getUsers().filter(u => u.id !== id);
            saveUsers(users);
            renderAdminUsers();
        };

        // Выход из админки
        document.getElementById('btn-admin-logout').onclick = () => {
            clearSession();
            location.hash = '#';
            router();
        };

        // Запуск при загрузке
        router();
    </script>
</body>
</html>
